# Browser smoke stack built from the immutable production PHP and frontend
# Dockerfiles. It is intentionally separate from fast functional E2E: the
# database is ephemeral and guarded by `_test`, while requests cross Caddy,
# Nginx and PHP-FPM exactly as they do in the release topology.
name: uvh-release-e2e

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: uvh_release_e2e_test
      POSTGRES_USER: uvh_release_e2e
      POSTGRES_PASSWORD: uvh_release_e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uvh_release_e2e -d uvh_release_e2e_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    image: uvh-api:release-e2e
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      # Deliberately `testing`: this stack proves the browser journeys and the
      # proxy contracts, not the production startup branch. Keeping it in
      # production mode would mean publishing Caddy on 443 (APP_URL must be the
      # exact HTTPS origin of APP_HOST) and switching the captcha surface to the
      # public sitekey, which would make CI depend on live hCaptcha. The
      # production startup contract has its own stack:
      # docker-compose.release-boot.yml.
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_SECRET: uvh-release-e2e-only-secret-never-use-outside-tests
      APP_URL: https://app.uvh.localhost:8443
      APP_HOST: app.uvh.localhost
      PUBLIC_HOST: uvh.localhost
      PUBLIC_ORIGIN: https://uvh.localhost:8443
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: uvh_release_e2e_test
      DB_USERNAME: uvh_release_e2e
      DB_PASSWORD: uvh_release_e2e_only
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: array
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ""
      SESSION_DOMAIN: ""
      SESSION_COOKIE: __Host-uvh_release_session
      CSRF_COOKIE: __Host-uvh_csrf
      # The same list Nginx uses to restore the client address. Laravel reads it
      # too, so the stack proves one contract rather than two.
      TRUSTED_PROXIES: 172.29.0.0/24
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    depends_on:
      postgres:
        condition: service_healthy
    # Note: wrapping the start command in a shell is exactly why the entrypoint's
    # production branch never runs here. It decides by $1, and `sh` never matches
    # `php-fpm`, so `uvh:release-check` is skipped without any visible symptom.
    # That is harmless while APP_ENV=testing and is asserted by the release-boot
    # contract, which keeps the image CMD intact.
    command:
      - sh
      - -lc
      - |
        case "$$DB_DATABASE" in
          *_test) ;;
          *) echo "Refusing release E2E schema reset outside a _test database" >&2; exit 64 ;;
        esac
        php artisan migrate:fresh --force --no-interaction
        exec php-fpm -F
    volumes:
      - release-storage:/var/www/html/storage
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,mode=1777

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.production
    image: uvh-web:release-e2e
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      APP_HOST: app.uvh.localhost
      PUBLIC_HOST: uvh.localhost
      EDGE_ASK_SECRET: release-e2e-edge-secret-not-used-by-public-smoke
      METRICS_BEARER_TOKEN: release-e2e-metrics-token-not-exposed
      TRUSTED_PROXIES: 172.29.0.0/24
      # Shipped defaults. `frontend/e2e/edge-limits.mjs` overrides them per phase
      # through compose interpolation, so the enforced and the dry-run rollout
      # are measured on the same image the release uses.
      EDGE_PUBLIC_RATE: ${EDGE_PUBLIC_RATE:-20r/s}
      EDGE_APP_RATE: ${EDGE_APP_RATE:-20r/s}
      EDGE_BURST: ${EDGE_BURST:-100}
      EDGE_CONN: ${EDGE_CONN:-64}
      EDGE_DRY_RUN: ${EDGE_DRY_RUN:-off}
      NGINX_ENVSUBST_FILTER: "^(APP_HOST|PUBLIC_HOST|EDGE_ASK_SECRET|METRICS_BEARER_TOKEN|EDGE_PUBLIC_RATE|EDGE_APP_RATE|EDGE_BURST|EDGE_CONN|EDGE_DRY_RUN)$"
    depends_on:
      - app
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev,mode=1777
      - /etc/nginx/conf.d:size=1m,noexec,nosuid,nodev,mode=1777
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev,mode=1777
      - /var/run:size=1m,noexec,nosuid,nodev,mode=1777

  edge:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    depends_on:
      - nginx
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/caddy/Caddyfile.release-e2e:/etc/caddy/Caddyfile:ro
      - release-caddy-data:/data
      - release-caddy-config:/config
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

volumes:
  release-storage:
  release-caddy-data:
  release-caddy-config:

networks:
  # Pinned for the same reason `docker-compose.release-boot.yml` pins its own:
  # TRUSTED_PROXIES has to describe the addresses the containers really use, and
  # Nginx restores the client address from that list. A subnet assigned at
  # random would make the fixture describe a network that does not exist.
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
