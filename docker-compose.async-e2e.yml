# Full asynchronous E2E stack. The browser stack (docker-compose.e2e.yml) only
# proves that a request is accepted; every queued job it produces is never
# consumed. This stack runs the real workers, the real scheduler and
# deterministic providers, so a scenario can follow
#   HTTP -> transaction -> commit -> queue -> worker -> retry -> final state
# to its end.
#
# Two deliberate differences from production are worth naming:
#   * APP_ENV stays `testing` so the anti-captcha and mail guards keep their
#     local behaviour. The production boot path is covered by
#     docker-compose.release-boot.yml instead.
#   * The webhook receiver lives on a routable-looking fixture subnet because
#     Ssrf::safeFetch refuses every private address by design. The guard is
#     not weakened for the test.
name: uvh-async-e2e

# Shared literals for the TLS harness: the ask secret travels from the
# application to the shim that attaches it to Caddy's ask requests, and the
# ACME contact is the same value Caddy registers with Pebble.
x-edge-ask-secret: &edge-ask-secret uvh-async-e2e-edge-ask-secret-0123456789abcdef
x-acme-email: &acme-email acme@tls.uvh

x-php-service: &php-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /app
  volumes:
    - ./backend-laravel:/app
    # The export path sizes its work against the production worker ceiling, so
    # this stack runs with the same one. Without it a maximum-size export is
    # refused by its own memory guard before a crash drill can reach it.
    - ./docker/php/uvh-worker-ceiling.ini:/usr/local/etc/php/conf.d/zz-uvh-worker-ceiling.ini:ro
    # TLS harness: the edge probe verifies against the local Pebble CA exactly
    # the way production verifies against public CAs, and the zone document
    # CoreDNS serves is written from the `app` lever. The trust file is
    # assembled at bring-up (Pebble's issuing CA is generated per start), so
    # it arrives through the shared `tls-trust` volume.
    - ./docker/tls-e2e/uvh-tls-e2e-ca.ini:/usr/local/etc/php/conf.d/zz-uvh-tls-e2e-ca.ini:ro
    - tls-trust:/usr/local/share/uvh:ro
    - tls-dns-zone:/zones
  environment: &php-environment
    APP_ENV: testing
    APP_DEBUG: "false"
    APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    APP_SECRET: uvh-async-e2e-only-secret-never-use-outside-tests
    APP_URL: http://127.0.0.1:${UVH_ASYNC_BACKEND_PORT:-8011}
    APP_HOST: 127.0.0.1
    PUBLIC_HOST: 127.0.0.1
    PUBLIC_ORIGIN: http://127.0.0.1:${UVH_ASYNC_BACKEND_PORT:-8011}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: uvh_e2e_test
    DB_USERNAME: uvh_e2e
    DB_PASSWORD: uvh_e2e_only
    BCRYPT_ROUNDS: "4"
    # The broker and cache store are the production ones. A suite that consumed
    # the `jobs` table would prove the async chains on a driver production no
    # longer runs, which is exactly the gap this stack exists to close.
    CACHE_STORE: redis
    CACHE_LIMITER: failover
    CACHE_FAILOVER_STORES: redis,database
    CACHE_PREFIX: uvh-async-cache-
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: uvh-async-e2e-only
    REDIS_PREFIX: uvh-async-
    REDIS_DB: "0"
    REDIS_CACHE_DB: "1"
    SESSION_DRIVER: database
    SESSION_COOKIE: uvh_async_session
    SESSION_DOMAIN: ""
    COOKIE_DOMAIN: ""
    COOKIE_SECURE: "false"
    QUEUE_CONNECTION: redis
    # Above the longest worker timeout in this stack (180 s), which is what the
    # production gate requires for the same reason.
    REDIS_QUEUE_RETRY_AFTER: "900"
    # A real SMTP conversation is required: UvhMail only short-circuits for the
    # development `log`/`array` mailers, so the mail chain must reach a socket.
    MAIL_MAILER: smtp
    MAIL_HOST: mail-sink
    MAIL_PORT: "1025"
    MAIL_FROM_ADDRESS: no-reply@e2e.uvh
    MAIL_FROM_NAME: UVH
    # Non-empty target: routing ownership must be proven by a real CNAME lookup
    # instead of the local-development shortcut. The name lives in the TLS
    # harness zone and resolves to the edge, so the chain a user follows (CNAME
    # to the edge) is the chain the ACME validator follows too.
    CUSTOM_DOMAIN_CNAME_TARGET: edge.tls.uvh
    # TLS harness wiring: the ask secret, the ACME contact and the internal
    # edge the certificate probe pins and checks.
    EDGE_ASK_SECRET: *edge-ask-secret
    ACME_EMAIL: *acme-email
    EDGE_INTERNAL_HOST: edge
    EDGE_INTERNAL_CIDRS: 172.31.0.0/24
    UVH_TLS_ZONE_FILE: /zones/db.tls.uvh
    HCAPTCHA_SITE_KEY: 10000000-ffff-ffff-ffff-000000000001
    HCAPTCHA_SECRET: uvh-e2e-hcaptcha-secret
    HCAPTCHA_VERIFY_URL: http://hcaptcha:8080/siteverify
    HCAPTCHA_DEV_FALLBACK: "false"
    REGISTER_LIMIT: "100"
    AUTH_LIMIT: "100"
    RESOLVE_LIMIT: "5000"
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    PHP_CLI_SERVER_WORKERS: "4"
  # Joining `fixture` is what makes the webhook receiver reachable: bridge
  # networks are isolated, so a worker has to share the network that owns the
  # 11.0.0.10 address instead of merely routing to it.
  networks:
    - backend
    - fixture
  # Route lookups through the fixture so `.e2e.uvh` is authoritative here.
  # Every other name (postgres, mail-sink, ...) is forwarded upstream.
  dns:
    - 172.31.0.53

x-queue-service: &queue-service
  <<: *php-service
  depends_on:
    redis:
      condition: service_healthy
    app:
      condition: service_healthy

services:
  # One-off commands (`composer install`, diagnostics). It deliberately carries
  # no healthcheck: the application's probe checks the broker, and during this
  # pre-start step the broker is not up yet, so inheriting the probe would spawn
  # overlapping processes that starve the very command being run. No ports and
  # no dependencies either, so `run --rm --no-deps tools ...` starts nothing
  # else and cannot disturb a running stack.
  #
  # It sits behind a profile so a plain `up` never creates it: the service exits
  # on its own, and `docker compose up --wait` treats *any* exited container as
  # a failed start, so leaving it in the default set makes the whole stack look
  # broken while every real service came up healthy. `compose run tools` names
  # the service explicitly and therefore ignores the profile.
  tools:
    <<: *php-service
    profiles: [tools]

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: uvh_e2e_test
      POSTGRES_USER: uvh_e2e
      POSTGRES_PASSWORD: uvh_e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uvh_e2e -d uvh_e2e_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - backend

  # Cache, rate limits, locks and the queues. Ephemeral on purpose: this stack
  # exists to prove the chains, and durability across a Redis restart is proven
  # by the reconciler drill in the same harness.
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      UVH_REDIS_PASSWORD: uvh-async-e2e-only
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly no
        --maxmemory-policy noeviction
        --requirepass "$${UVH_REDIS_PASSWORD}"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${UVH_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - backend

  hcaptcha:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend-laravel:/app:ro
    environment:
      HCAPTCHA_E2E_SECRET: uvh-e2e-hcaptcha-secret
    command: ["php", "-S", "0.0.0.0:8080", "tests/E2E/hcaptcha-stub.php"]
    networks:
      - backend

  # Deterministic provider: records every attempt and can reject on demand.
  mail-sink:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend-laravel:/app:ro
      - async-fixture-state:/state
    environment:
      UVH_FIXTURE_STATE: /state/mail.json
      UVH_SMTP_SINK_PORT: "1025"
    ports:
      - "127.0.0.1:${UVH_ASYNC_MAIL_CONTROL_PORT:-8092}:8081"
    command:
      - sh
      - -c
      - php -S 0.0.0.0:8081 tests/E2E/fixture-control.php & exec php tests/E2E/smtp-sink.php
    networks:
      - backend

  # Deterministic receiver on a routable-looking fixture address. Port 8080 is
  # one of the four ports Ssrf::assertSafeUrl allows.
  webhook-sink:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend-laravel:/app:ro
      - async-fixture-state:/state
    environment:
      UVH_FIXTURE_STATE: /state/webhook.json
    ports:
      - "127.0.0.1:${UVH_ASYNC_WEBHOOK_CONTROL_PORT:-8090}:8080"
    command: ["php", "-S", "0.0.0.0:8080", "tests/E2E/webhook-sink.php"]
    networks:
      backend:
      fixture:
        ipv4_address: 11.0.0.10

  # Authoritative for `.e2e.uvh`; forwards every other query to CoreDNS — the
  # TLS harness authority for `tls.uvh`, which recurses to Docker's embedded
  # resolver — so internal names keep working through the same chain the
  # platform's own lookups use.
  dns-fixture:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend-laravel:/app:ro
      - async-fixture-state:/state
    environment:
      UVH_FIXTURE_STATE: /state/dns.json
      UVH_DNS_ZONE: e2e.uvh
      UVH_DNS_UPSTREAM: 172.31.0.54:53
    ports:
      - "127.0.0.1:${UVH_ASYNC_DNS_CONTROL_PORT:-8091}:8081"
    command:
      - sh
      - -c
      - php -S 0.0.0.0:8081 tests/E2E/fixture-control.php & exec php tests/E2E/dns-fixture.php
    networks:
      backend:
        ipv4_address: 172.31.0.53

  app:
    <<: *php-service
    ports:
      - "127.0.0.1:${UVH_ASYNC_BACKEND_PORT:-8011}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hcaptcha:
        condition: service_started
      mail-sink:
        condition: service_started
      dns-fixture:
        condition: service_started
    healthcheck:
      # The probe is a full Laravel CLI boot, and this stack mounts the
      # workspace through a bind mount. On Docker Desktop for Windows a cold
      # boot measured 12-14 s, so a 10 s timeout made the container report
      # `starting` forever and the whole stack fail to come up — the probe, not
      # the application, was the failure. The generous timeout keeps the check
      # meaningful (it still has to boot, reach the schema and round-trip the
      # rate limiter's store) without racing the I/O of the host filesystem.
      test: ["CMD", "php", "artisan", "uvh:healthcheck", "app"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s
    # The shell must stay a non-login `sh -c`: a login shell re-runs
    # /etc/profile, which resets PATH and drops /usr/local/sbin for non-root
    # users, so `php-fpm` — shipped there by the upstream image — is never
    # found and the app exits 127.
    command:
      - sh
      - -c
      - |
        case "$$DB_DATABASE" in
          *_test) ;;
          *) echo "Refusing async E2E schema reset outside a _test database" >&2; exit 64 ;;
        esac
        php artisan migrate:fresh --force --no-interaction
        exec php -d opcache.enable_cli=1 -S 0.0.0.0:8000 -t public public/index.php

  # One worker per queue class, mirroring the production topology. A long DNS
  # or export job therefore cannot starve mail or webhook delivery.
  #
  # No service here pins `container_name`, which is what keeps
  # `docker compose up -d --scale queue-analytics=N` available: the rollup
  # contention drill in `frontend/e2e/async/analytics-contention.mjs` uses it to put more than
  # one consumer behind the same daily rollup row. Production intentionally
  # stays at one worker per pool.
  queue-mail:
    <<: *queue-service
    command: ["php", "artisan", "queue:work", "--queue=mail", "--sleep=1", "--tries=3", "--timeout=120"]
  queue-webhooks:
    <<: *queue-service
    command: ["php", "artisan", "queue:work", "--queue=webhooks", "--sleep=1", "--tries=3", "--timeout=60"]
  queue-domains:
    <<: *queue-service
    command: ["php", "artisan", "queue:work", "--queue=domains", "--sleep=1", "--tries=3", "--timeout=90"]
  queue-exports:
    <<: *queue-service
    command: ["php", "artisan", "queue:work", "--queue=exports", "--sleep=1", "--tries=3", "--timeout=660"]
  queue-analytics:
    <<: *queue-service
    command: ["php", "artisan", "queue:work", "--queue=analytics", "--sleep=1", "--tries=5", "--timeout=45"]
  # Destination-reputation checks. The suite asserts every monitored queue
  # drains to zero, so this pool needs a real consumer here too.
  queue-security:
    <<: *queue-service
    command: ["php", "artisan", "queue:work", "--queue=security", "--sleep=1", "--tries=3", "--timeout=60"]
  # Compatibility pool for jobs that predate the per-class workers.
  queue-default:
    <<: *queue-service
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=1", "--tries=3", "--timeout=180"]

  scheduler:
    <<: *php-service
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  # Real DNS for the TLS chain. The scenario publishes one zone document
  # (`domain-dns-serve`) holding the customer hostname, the edge address and
  # the ownership TXT; the platform verifies through dns-fixture and Pebble's
  # VA queries this server directly. An empty `/zones` at boot is fine: `auto`
  # picks the file up within its reload window.
  coredns:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./docker/tls-e2e/Corefile:/etc/coredns/Corefile:ro
      - tls-dns-zone:/zones:ro
    networks:
      backend:
        ipv4_address: 172.31.0.54

  # The ACME CA for the TLS chain. Its validator answers challenges against
  # the real edge ports (80/443) and resolves every name through the harness
  # DNS, so an issuance here is a real issuance. What it signs comes from the
  # Mini CA in docker/tls-e2e/pebble.minica.pem, which the edge serves and the
  # platform's probe trusts.
  pebble:
    build:
      context: .
      dockerfile: docker/tls-e2e/Dockerfile.pebble
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "172.31.0.54:53"]
    environment:
      # No artificial validator sleeps and no random nonce rejections: the
      # chain must fail on facts about DNS and TLS, never on Pebble's pacing.
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      - ./docker/tls-e2e/pebble-config.json:/test/config/pebble-config.json:ro
    networks:
      - backend

  # The secret-injection shim behind Caddy's ask (production's Nginx internal
  # listener). Caddy cannot attach headers to its ask requests, and nothing
  # without this shim's secret passes the application's gate. Before serving,
  # it assembles the trust file every probe verifies with: Pebble's issuing
  # hierarchy is generated per start, so the anchors are runtime facts fetched
  # from its management API (verified against the static Mini CA).
  edge-ask-shim:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend-laravel:/app:ro
      - ./docker/tls-e2e/pebble.minica.pem:/certs/pebble.minica.pem:ro
      - tls-trust:/usr/local/share/uvh
    environment:
      EDGE_ASK_SECRET: *edge-ask-secret
      UVH_ASK_UPSTREAM: http://app:8000
    command:
      - sh
      - -c
      - php tests/E2E/pebble-ca-trust.php && exec php -S 0.0.0.0:8081 tests/E2E/edge-ask-shim.php
    networks:
      - backend

  # The TLS edge: on-demand certificates from Pebble, with the ask gate on
  # every handshake and again on every request. Its fixed address is what the
  # zone publishes and what the platform's probe pins (`CURLOPT_RESOLVE`), so
  # nothing depends on DNS round trips for the customer hostname.
  edge:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      ACME_EMAIL: *acme-email
    volumes:
      - ./docker/caddy/Caddyfile.tls-e2e:/etc/caddy/Caddyfile:ro
      - ./docker/tls-e2e/pebble.minica.pem:/certs/pebble.minica.pem:ro
    # Ephemeral ACME storage: every suite run earns its certificate again.
    tmpfs:
      - /data
      - /config
    networks:
      backend:
        ipv4_address: 172.31.0.80

volumes:
  async-fixture-state:
  tls-dns-zone:
  tls-trust:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  fixture:
    ipam:
      config:
        - subnet: 11.0.0.0/24
