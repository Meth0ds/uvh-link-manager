# Overlay for the rollup capacity drill: php-fpm behind nginx.
#
# The stack it overlays serves HTTP with PHP's built-in server. That is fine for
# proving asynchronous chains, but it makes the *arrival* passes of the rollup
# drill a measurement of the harness: the redirect request is several times
# slower than the worker's cost per click, so no backlog ever forms and the
# question the drill exists for — many workers competing for one daily row —
# cannot be reproduced with real admitted traffic.
#
# Used only with `UVH_ASYNC_EXTRA_COMPOSE` (see `frontend/e2e/async/topology.mjs`)
# and never by CI. The rest of the stack is untouched:
#
#   docker compose -p uvh-async-e2e \
#     -f docker-compose.async-e2e.yml -f docker-compose.analytics-drill.yml up -d
name: uvh-async-e2e

services:
  app:
    # The pool listens on FastCGI, not on an HTTP port, so the built-in server's
    # published port is withdrawn here: the edge below is what answers on it.
    ports: !reset []
    build:
      context: .
      dockerfile: docker/php/Dockerfile.drill-fpm
    environment:
      # The application restores the client address from the proxies it trusts;
      # without this every request would look like it came from the edge.
      TRUSTED_PROXIES: ${UVH_DRILL_TRUSTED_PROXIES:-172.16.0.0/12}
    command:
      - sh
      - -lc
      - |
        case "$$DB_DATABASE" in
          *_test) ;;
          *) echo "Refusing drill schema reset outside a _test database" >&2; exit 64 ;;
        esac
        php artisan migrate:fresh --force --no-interaction
        exec php-fpm -F
    healthcheck:
      # Same probe as the built-in-server stack, with room for the pool to come
      # up: the check is a full Laravel CLI boot, not a socket accept.
      test: ["CMD", "php", "artisan", "uvh:healthcheck", "app"]
      interval: 5s
      timeout: 30s
      retries: 40
      start_period: 20s

  # The web tier under measurement: nginx talking FastCGI to the app pool.
  #
  # Pinned by digest like the rest of the topologies, and on the same Alpine
  # line as the production edge: 1.27-alpine was Alpine 3.21.3 with openssl
  # 3.3.3-r0, which the image gate rejects for `CVE-2026-31789`.
  edge:
    image: nginx:1.31-alpine@sha256:3a7edb153fcd67884f51775c8bed68a418fac7328a31d2be4c4ed5cae816ce8d
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Both names resolve to this one web tier. `UVH_ASYNC_BACKEND_PORT` is the
      # origin every other scenario in the harness already uses, and
      # `UVH_ASYNC_EDGE_PORT` is the one the drill labels as the edge under test.
      - "127.0.0.1:${UVH_ASYNC_BACKEND_PORT:-8011}:8080"
      - "127.0.0.1:${UVH_ASYNC_EDGE_PORT:-8012}:8080"
    volumes:
      - ./docker/nginx/uvh.drill.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - backend
