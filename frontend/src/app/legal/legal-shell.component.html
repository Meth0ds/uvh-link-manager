<!-- RouterLink keeps this fragment on the current document despite base href="/". -->
<a class="skip-link" [routerLink]="[]" fragment="public-content" (click)="publicContent.focus()">Ir al contenido</a>
<header class="legal-header">
  <div class="legal-header-inner">
    <a class="brand" routerLink="/" aria-label="UVH, volver a la página principal">uvh<span>.</span></a>
    <span class="brand-caption">Enlaces con recorrido.</span>
    <nav class="legal-nav-links" aria-label="Documentos legales y soporte">
      <a routerLink="/help" routerLinkActive="active" ariaCurrentWhenActive="page">Ayuda</a>
      <a routerLink="/legal/terminos" routerLinkActive="active" ariaCurrentWhenActive="page">Términos</a>
      <a routerLink="/legal/privacidad" routerLinkActive="active" ariaCurrentWhenActive="page">Privacidad</a>
      <a routerLink="/legal/denuncias" routerLinkActive="active" ariaCurrentWhenActive="page">Denunciar enlace</a>
    </nav>
    <div class="legal-actions"><app-public-theme-toggle /><a class="back-product" routerLink="/">Volver a UVH <span aria-hidden="true">↗</span></a></div>
  </div>
</header>
<main #publicContent class="legal-main" id="public-content" tabindex="-1"><div class="legal-container"><ng-content /></div></main>
<footer class="legal-footer"><div class="legal-footer-inner"><a class="brand" routerLink="/" aria-label="UVH, inicio">uvh<span>.</span></a><p>Enlaces cortos.<br />Decisiones que siguen en tus manos.</p><nav aria-label="Enlaces del pie legal"><a routerLink="/help">Ayuda</a><a routerLink="/status">Estado del servicio</a><a routerLink="/legal/privacidad">Privacidad</a><a routerLink="/legal/terminos">Términos</a></nav><span class="copyright">© {{ year }} UVH</span></div></footer>
