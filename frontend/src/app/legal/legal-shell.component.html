<header class="legal-header">
  <div class="legal-header-inner">
    <a class="brand" routerLink="/" aria-label="UVH, volver a la página principal">
      <span class="brand-mark" aria-hidden="true"><mat-icon>link</mat-icon></span>
      <span class="brand-copy"><b>UVH</b><small>Legal y soporte</small></span>
    </a>

    <nav class="legal-nav-links" aria-label="Documentos legales y soporte">
      <a routerLink="/legal/terminos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Términos</a>
      <a routerLink="/legal/privacidad" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Privacidad</a>
      <a routerLink="/legal/denuncias" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span>Denunciar abuso</span><i aria-hidden="true"></i></a>
    </nav>

    <div class="legal-actions">
      <app-theme-toggle />
      <a class="back-product" routerLink="/"><span>Volver a UVH</span><mat-icon aria-hidden="true">arrow_outward</mat-icon></a>
    </div>
  </div>
</header>

<main class="legal-main">
  <div class="legal-container">
    <ng-content />
  </div>
</main>

<footer class="legal-footer">
  <div class="legal-footer-inner">
    <div><span class="footer-mark"><mat-icon aria-hidden="true">link</mat-icon></span><span><b>UVH</b><small>Operación responsable de enlaces</small></span></div>
    <nav aria-label="Enlaces del pie legal"><a routerLink="/legal/terminos">Términos</a><a routerLink="/legal/privacidad">Privacidad</a><a routerLink="/legal/denuncias">Abuso</a></nav>
    <span class="copyright">© {{ year }} UVH · uvh.es</span>
  </div>
</footer>
