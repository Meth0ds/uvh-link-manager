<div class="wrap">
  <div class="card">
    <h2>Recuperar contraseña</h2>
    <p class="sub">Introduce tu email y te enviaremos un enlace para restablecerla.</p>

    <form *ngIf="!sent()" class="form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-icon matPrefix>mail_outline</mat-icon>
      </mat-form-field>
      <div class="alert error" *ngIf="error()">{{ error() }}</div>
      <button mat-flat-button color="primary" type="submit" class="submit" [disabled]="form.invalid || busy()">
        Enviar enlace
      </button>
    </form>

    <div *ngIf="sent()" class="alert ok">
      Si existe una cuenta con ese email, recibirás un enlace para restablecer tu contraseña.
    </div>

    <a class="back" routerLink="/auth">← Volver a iniciar sesión</a>
  </div>
</div>
