<a class="skip-link" href="#status-content" (click)="focusMain(statusContent)">Saltar al contenido</a>
<app-public-theme-toggle />
<main #statusContent id="status-content" tabindex="-1">
  <div class="wrap">
    <p class="kicker">UVH Link Manager</p>
    <h1>
      <span class="code" aria-hidden="true">{{ code }}</span>
      <span class="headline">{{ title }}</span>
    </h1>
    <p class="lead">{{ lead }}</p>
    <div class="actions">
      @if (forbidden) {
        <a mat-flat-button color="primary" href="/app/dashboard"><mat-icon aria-hidden="true">space_dashboard</mat-icon>Ir al panel</a>
      } @else {
        <a mat-flat-button color="primary" href="/"><mat-icon aria-hidden="true">home</mat-icon>Volver al inicio</a>
      }
      @for (extra of extras; track extra.href) {
        <a mat-stroked-button [href]="extra.href"><mat-icon aria-hidden="true">{{ extra.icon }}</mat-icon>{{ extra.label }}</a>
      }
    </div>
  </div>
</main>
