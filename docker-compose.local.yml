# Desarrollo local UVH: PostgreSQL + PHP/Composer + Laravel (serve/queue/schedule).
# PostgreSQL solo se publica en 127.0.0.1 (no se expone fuera de localhost).
#
# Uso:
#   cp .env.docker.local.example .env.docker.local
#   docker compose -f docker-compose.local.yml --env-file .env.docker.local up -d postgres
#   docker compose -f docker-compose.local.yml --env-file .env.docker.local run --rm php composer --version
#
# El perfil "laravel" (app/queue/schedule) exige que backend-laravel/ ya exista
# (creado con `composer create-project laravel/laravel backend-laravel`). Para
# arrancar la app completa una vez exista el scaffold:
#   docker compose -f docker-compose.local.yml --env-file .env.docker.local --profile laravel up -d

x-php-service: &php-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: uvh-php:8.4
  working_dir: /app
  volumes:
    - ./backend-laravel:/app
  environment:
    COMPOSER_ALLOW_SUPERUSER: "1"
    APP_ENV: local
    APP_URL: http://localhost:8000
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${POSTGRES_DB:-uvh_local}
    DB_USERNAME: ${POSTGRES_USER:-uvh_local}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-uvh_local_dev_only}
    QUEUE_CONNECTION: database
    # The PHP development server runs inside Linux but serves files from a
    # Windows bind mount. A small worker pool prevents one cold request from
    # making every local health/API request appear hung.
    PHP_CLI_SERVER_WORKERS: "4"
    SESSION_COOKIE: uvh_session
    # Regla de seguridad crítica: sin dominio compartido; nunca ".uvh.es".
    SESSION_DOMAIN: ""
    COOKIE_DOMAIN: ""
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker.local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - uvh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Herramienta puntual: composer / artisan / php one-off.
  php:
    <<: *php-service
    command: ["php", "-v"]

  # Laravel: servidor PHP de desarrollo en 127.0.0.1:8000. Se lanza
  # directamente para conservar las variables del contenedor; `artisan serve`
  # vuelve a exportar el `.env` cargado por el proceso padre y puede pisar un
  # override como DB_DATABASE=uvh_test.
  app:
    <<: *php-service
    profiles: ["laravel"]
    ports:
      - "127.0.0.1:8000:8000"
    command: ["php", "-d", "opcache.enable_cli=1", "-d", "opcache.validate_timestamps=1", "-S", "0.0.0.0:8000", "-t", "public", "public/index.php"]

  # Laravel: worker de cola (QUEUE_CONNECTION=database).
  queue:
    <<: *php-service
    profiles: ["laravel"]
    command: ["php", "artisan", "queue:work"]

  # Laravel: scheduler local (php artisan schedule:work).
  schedule:
    <<: *php-service
    profiles: ["laravel"]
    command: ["php", "artisan", "schedule:work"]

volumes:
  uvh-postgres-data:
