version: 2

# Dependabot abre PRs pequeños y revisables. Las actualizaciones mayores quedan
# separadas porque pueden cambiar contratos de framework o requisitos de runtime.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps(frontend)
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /backend-laravel
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps(backend)
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # También mantiene los SHA fijados de las acciones. Las revisiones siguen
  # mostrando de forma explícita qué código externo cambiará.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps(actions)
