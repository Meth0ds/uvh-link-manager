version: 2

# Dependabot abre PRs pequeños y revisables. Las actualizaciones mayores quedan
# separadas porque pueden cambiar contratos de framework o requisitos de runtime.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Un paquete comprometido suele retirarse en cuestión de días. La espera
    # convierte esa ventana en una versión que nunca llega a proponerse, sin
    # renunciar a las actualizaciones: sólo las retrasa.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(frontend)
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /backend-laravel
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(backend)
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Mantiene los digests con los que se construyen las imágenes. Cada
  # directorio que contiene un Dockerfile tiene su entrada, y la raíz cubre los
  # ficheros de compose: Dependabot lee cualquier YAML cuyo nombre no empiece
  # por punto y actualiza los `image:` que encuentre dentro. Sin esto, un digest
  # fijado deja de recibir parches en cuanto se escribe, que es la forma más
  # silenciosa de envejecer. Dependabot conserva la etiqueta y mueve el digest,
  # así que la revisión sigue leyendo el release, no un número opaco.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(images)

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(images)

  - package-ecosystem: docker
    directory: /docker/nginx
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(images)

  - package-ecosystem: docker
    directory: /docker/backup
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(images)

  - package-ecosystem: docker
    directory: /docker/release-boot/certs
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(images)

  # También mantiene los SHA fijados de las acciones. Las revisiones siguen
  # mostrando de forma explícita qué código externo cambiará.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(actions)
