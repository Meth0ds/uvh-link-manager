# Isolated browser-test stack. It has no persistent volume and every database
# name is guarded by the `_test` suffix before Laravel may reset its schema.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uvh_e2e_test
      POSTGRES_USER: uvh_e2e
      POSTGRES_PASSWORD: uvh_e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uvh_e2e -d uvh_e2e_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Cache, rate limits, locks and the queues. Ephemeral: the stack is rebuilt
  # from scratch on every run, which is what keeps limiter state from leaking
  # between specs now that it no longer lives in the database.
  redis:
    image: redis:7-alpine
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      UVH_REDIS_PASSWORD: uvh-e2e-only
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly no
        --maxmemory-policy noeviction
        --requirepass "$${UVH_REDIS_PASSWORD}"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${UVH_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  hcaptcha:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend-laravel:/app:ro
    environment:
      HCAPTCHA_E2E_SECRET: uvh-e2e-hcaptcha-secret
    command: ["php", "-S", "0.0.0.0:8080", "tests/E2E/hcaptcha-stub.php"]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend-laravel:/app
    ports:
      - "127.0.0.1:${UVH_E2E_BACKEND_PORT:-8010}:8000"
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_SECRET: uvh-e2e-only-secret-never-use-outside-tests
      APP_URL: http://127.0.0.1:4201
      APP_HOST: 127.0.0.1
      PUBLIC_HOST: 127.0.0.1
      PUBLIC_ORIGIN: http://127.0.0.1:${UVH_E2E_BACKEND_PORT:-8010}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: uvh_e2e_test
      DB_USERNAME: uvh_e2e
      DB_PASSWORD: uvh_e2e_only
      BCRYPT_ROUNDS: "4"
      # Same broker and cache store as production, so no suite silently runs a
      # store the deployment never uses.
      CACHE_STORE: redis
      CACHE_LIMITER: failover
      CACHE_FAILOVER_STORES: redis,database
      CACHE_PREFIX: uvh-e2e-cache-
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: uvh-e2e-only
      REDIS_PREFIX: uvh-e2e-
      REDIS_DB: "0"
      REDIS_CACHE_DB: "1"
      SESSION_DRIVER: database
      SESSION_COOKIE: uvh_e2e_session
      SESSION_DOMAIN: ""
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: "300"
      MAIL_MAILER: array
      HCAPTCHA_SITE_KEY: 10000000-ffff-ffff-ffff-000000000001
      HCAPTCHA_SECRET: uvh-e2e-hcaptcha-secret
      HCAPTCHA_VERIFY_URL: http://hcaptcha:8080/siteverify
      # One isolated run creates more than ten unique users from the same
      # container IP. Raise only the E2E ceiling; production keeps its strict
      # default and the anti-enumeration/rate-limit cases remain explicit.
      REGISTER_LIMIT: "100"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      # The panel loads independent resources concurrently. Multiple workers
      # prevent the PHP development server from serializing those requests.
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hcaptcha:
        condition: service_started
    command:
      - sh
      - -lc
      - |
        case "$$DB_DATABASE" in
          *_test) ;;
          *) echo "Refusing E2E schema reset outside a _test database" >&2; exit 64 ;;
        esac
        php artisan migrate:fresh --force --no-interaction
        exec php -d opcache.enable_cli=1 -S 0.0.0.0:8000 -t public public/index.php
