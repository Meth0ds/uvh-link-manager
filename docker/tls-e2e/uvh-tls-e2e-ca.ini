; TLS harness only. The single TLS peer this stack ever talks to is the local
; Caddy edge, whose certificates are issued by the local Pebble CA, so the
; platform's edge probe verifies exactly the way production verifies against
; public CAs — just against this CA. There is deliberately no public root in
; this store: an accidental HTTPS call to the internet must fail here instead
; of slipping through unnoticed.
;
; The file itself is assembled at stack bring-up (`pebble-ca-trust.php`):
; Pebble generates its issuing hierarchy on every start, so the anchors are
; fetched from its management API instead of being fixtures.
curl.cainfo=/usr/local/share/uvh/pebble-ca.pem
openssl.cafile=/usr/local/share/uvh/pebble-ca.pem
