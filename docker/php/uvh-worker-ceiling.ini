; Worker memory ceiling for the asynchronous E2E stack.
;
; The automated account-export path sizes its own work against the production
; worker ceiling: `GenerateDataExportJob` refuses to build a payload unless
; 96 MiB stay free after it, and production runs PHP with `memory_limit=256M`
; (see `docker/php/uvh-production.ini`). The development image keeps PHP's
; default 128M, under which a near-capacity export is refused before it can be
; exercised at all — the crash drills would then be measuring the harness
; instead of the release.
;
; Mounted only by `docker-compose.async-e2e.yml`, so the local development
; stack keeps its lighter limit.
memory_limit=256M
