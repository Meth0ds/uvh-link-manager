# Edge for the capacity drill.
#
# Deliberately minimal, and deliberately not the production template: this is
# measurement scaffolding whose only job is to put a real FastCGI web tier in
# front of the application so the drill's arrival passes measure the stack
# instead of PHP's built-in development server. Rate limiting, TLS, the internal
# edge listener and the custom-domain server blocks belong to the production
# template and are exercised by `EdgeLimitContractTest`, not here.
server {
    listen 8080;
    server_name _;

    # One entry point for every request: the drill only needs the redirect path,
    # and asking nginx to serve static files from a bind mount would measure the
    # host filesystem rather than the application.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTPS off;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 30s;
    }
}
