# The private network and the TLS certificate must agree with the release
# manifest. Credentials never enter this file or the image.
listen_addresses = '*'
port = 5432
hba_file = '/etc/uvh-postgres/pg_hba.conf'
password_encryption = 'scram-sha-256'
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/tls/server.crt'
ssl_key_file = '/tls/server.key'
max_connections = 100
shared_buffers = '128MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
log_destination = 'stderr'
logging_collector = off
log_connections = off
log_disconnections = off
# Do not write passwords from initialization or rotation into error logs.
log_statement = 'none'
log_min_error_statement = 'panic'
timezone = 'UTC'
