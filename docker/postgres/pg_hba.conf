# Only the postgres OS account may use the local administration socket.
local   all   postgres                              peer
local   all   all                                   reject
# An explicit reject comes before all TLS grants: a private IP alone never
# permits cleartext connections. No database port is published by Compose.
hostnossl all  all             0.0.0.0/0             reject
hostnossl all  all             ::/0                  reject
hostssl uvh   uvh_app          172.30.0.0/24          scram-sha-256
hostssl uvh   uvh_migrator     172.30.0.0/24          scram-sha-256
hostssl uvh   uvh_backup       172.30.0.0/24          scram-sha-256
host    all   all             0.0.0.0/0              reject
host    all   all             ::/0                   reject
